services:
  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: go_auth_proxy
    ports:
      - "8080:8080"
    environment:
      PROXY_ADDR: ":8080"
      PROXY_USER: "proxyuser"
      PROXY_PASS: "proxypass123"
      PROXY_AUTH_ENABLED: "true"
      PROXY_VERBOSE: "true"
      PROXY_DIAL_TIMEOUT: ${PROXY_DIAL_TIMEOUT:-10s}
      PROXY_TLS_TIMEOUT: ${PROXY_TLS_TIMEOUT:-10s}
      PROXY_IDLE_TIMEOUT: ${PROXY_IDLE_TIMEOUT:-120s}
      PROXY_READ_HEADER_TIMEOUT: ${PROXY_READ_HEADER_TIMEOUT:-10s}
    restart: unless-stopped